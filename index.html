<!DOCTYPE html>
<html lang="en-us">
<head>
<meta charset="UTF-8">
<style>
  button{
    background-color: #04AA6D;
    border-radius: 5px;
    padding: 10px 30px;
    border: none;
    color: white;
    text-align: center;
    display: inline;
    font-size: 13px;
    margin: 4px 2px;
    cursor: pointer;
  }
  input{
    border-radius: 8px;
    padding: 14px 30px;
    border-color:rgb(180, 185, 188);
  }
  div{
    background-color:black;
    width:100px;
    height:100px;
  }
  .hidden{
    display: none;
  }
  .square{
  display:inline-block;
   background-color:Black
  }
  #stats {
            width: 250px;
            height: 20px;
            position: fixed; 
            top: 10px; 
            right: 10px; 
            padding: 10px;
            background-color: rgb(250, 250, 250);
            color: rgb(0, 0, 0);
            border-radius: 5px;
            font-family: Arial, sans-serif;
  }
  .editable {
            display: inline-block;
            width: 500px;
            height: 100px;
            border: 1px solid #ccc;
            padding: 10px;
            margin: 10px;
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
            border-radius: 5px;
            overflow-y: auto;
  }
  #scrollToTopBtn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            display: none; 
            padding: 10px 15px;
            font-size: 16px;
            background-color: #04AA6D;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: opacity 0.3s; 
        }
  .outer {
            width: 300px;
            height: 300px;
            background-color: #04AA6D;
            display: flex;
            align-items: center;
            justify-content: center;
        }

  .inner {
            width: 150px;
            height: 150px;
            background-color:  white;
        }
  #overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(128, 128, 128, 0.7); 
            display: none; 
            justify-content: center;
            align-items: center;
            z-index: 1000; 
            }
  .inputChange {
     background-color: #b6b6b6;
     border-radius: 5%;
     padding: 10px 10px;
     border: none;
  }
  .inputSelected {
     background-color: #04AA6D;
     border-radius: 5%;
     padding: 10px 10px;
     border: none;
  }

</style>
</head>

<script>
  function deleteSquare(){
    document.getElementById("di").remove()
  }
  function makeHidden(){
    document.getElementById("di").className = "hidden";
  }
  function switchVisibility(){
    const x = document.getElementsByClassName("square");
    for(let i = 0; i < x.length; i++){
      if(x[i].style.display == 'none'){
        x[i].style.display = 'inline-block'
      }else{
        x[i].style.display = 'none'
      }
    }
  }
  
  /**
   * the setSelector function allows us to input a selector 
   * and hide all the elements that fall under the said selector
   */ 
  function setSelector(){
    const input = document.getElementById("selector").value
    const selected = document.querySelectorAll(input);
    for(let i = 0; i < selected.length; i++){
      selected[i].style.display == 'none'? selected[i].style.display = 'inline-block':selected[i].style.display = 'none';
    } 
  }

       yellowSquare.style.display = "none"
  }

  redButton.addEventListener("mouseout", onMouseOut)
  function onMouseOver(){
    redSquare.style.display = "none"
  }

    "<br>Longitude: " + position.coords.longitude;
  }
  document.addEventListener("mousemove", updateCoordinates);

   */

    console.log(value)
    document.cookie = name + "=" + value + expires + ";path=/";
    console.log(document.cookie)
  }

    }

  function loadContent(){
    document.getElementById("block1").innerText = localStorage.getItem("block1")
    document.getElementById("block2").innerText = sessionStorage.getItem("block2")
    document.getElementById("block3").innerText = getCookie("block3")
  }
  function saveCookie(element) {
    const content = document.getElementById(element).innerText;
    setCookie(element, content); 
  }
  function saveLocal(element){
    const content = document.getElementById(element).innerText;
    localStorage.setItem(element, content);
  }
  function saveSession(element){
    const content = document.getElementById(element).innerText;
    sessionStorage.setItem(element, content);
  }

  document.getElementById("block1").addEventListener("input", () => saveLocal("block1"));
  document.getElementById("block2").addEventListener("input", () => saveSession("block2"));
  document.getElementById("block3").addEventListener("input", () => saveCookie("block3"));
  window.onload = loadContent;
  /**
   * the following function powers
   * the button to scroll up 
   */ 
   const scrollToTopBtn = document.getElementById("scrollToTopBtn");


  window.onscroll = function() {
      if (window.scrollY > 300) { 
          scrollToTopBtn.style.display = "block";
      } else {
          scrollToTopBtn.style.display = "none";
      }
  };
  function scrollToTop() {
      window.scrollTo({

          behavior: "smooth"
      });
  }

  /**

  /**

   */
  let inFile = document.getElementById("fileDrop")
  inFile.addEventListener('dragover', (event)=>{

    inFile.classList.add("inputChange")
  })
  inFile.addEventListener('dragleave', () => {
    inFile.classList.remove("inputChange")
  })

</script>
